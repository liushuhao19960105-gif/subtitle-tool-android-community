name: Dialogue Lexicon Staged Checks
on:
  push:
    branches: [feature/v191-dialogue-lexicon]
  pull_request:
    branches: [feature/v191-slang-modes-usage]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Full regression suite and real JVM lexicon tests
        run: python3 -m unittest discover -s tests -v
      - name: Build lexicon community debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify community APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
