name: Publish V1.9.1 Lexicon Community Source Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v191-lexicon-community-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'liushuhao19960105-gif/subtitle-tool-android-community' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify community source version and no private signing
        run: |
          grep -Fq 'versionCode 19' app/build.gradle
          grep -Fq "versionName '1.9.1-lexicon-community'" app/build.gradle
          if grep -q 'SUBTITLE_SIGNING_' app/build.gradle; then
            echo '::error::Private signing configuration must never enter community source'
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Full offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify community Android source compilation
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish source-only GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.9.1-lexicon'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'V1.9.1 对白词库增强版（社区开源源码）' \
            --notes-file docs/RELEASE_V191_LEXICON.md
