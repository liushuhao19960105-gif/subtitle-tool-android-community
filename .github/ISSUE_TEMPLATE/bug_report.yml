name: Bug report
description: Report a reproducible Android issue without sharing private files
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Do not submit real API keys, private videos, audio, or personal paths.
      placeholder: "1. Open app... 2. Select test clip... 3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Android version and app version
