name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Requested feature
      description: Please explain the use case; avoid sharing sensitive content.
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Privacy, API cost and compatibility considerations
